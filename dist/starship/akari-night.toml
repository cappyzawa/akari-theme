# Akari Night — Starship palette
# Named colors only — apply with: palette = 'akari-night'

[palettes.akari-night]
# Standard ANSI colors
black = '#1E1C19'
red = '#D25046'
green = '#7FAF6A'
yellow = '#D4A05A'
blue = '#7A8FA2'
purple = '#8E7BA0'
cyan = '#6F8F8A'
white = '#E6DED3'

# Bright variants
bright-black = '#716A5F'
bright-red = '#DE7F77'
bright-green = '#A1C492'
bright-yellow = '#E4C397'
bright-blue = '#A7B5C1'
bright-purple = '#B4A7C0'
bright-cyan = '#9AB1AD'
bright-white = '#EFEAE3'

# Theme roles (use in your modules: fg:accent, bg:surface, etc.)
accent = '#E26A3B'
accent-secondary = '#D4A05A'
on-accent = '#25231F'
surface = '#323333'
border = '#3F4346'
muted = '#9BABB9'
info = '#7A8FA2'
hint = '#9BABB9'
success = '#7FAF6A'
warning = '#E26A3B'
error = '#D25046'
