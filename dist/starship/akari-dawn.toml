# Akari Dawn — Starship palette
# Named colors only — apply with: palette = 'akari-dawn'

[palettes.akari-dawn]
# Standard ANSI colors
black = '#1A1816'
red = '#6A2828'
green = '#3A5830'
yellow = '#B07840'
blue = '#304050'
purple = '#806080'
cyan = '#305858'
white = '#E4DED6'

# Bright variants
bright-black = '#514B45'
bright-red = '#3E1717'
bright-green = '#20301A'
bright-yellow = '#78522C'
bright-blue = '#131A20'
bright-purple = '#543F54'
bright-cyan = '#152727'
bright-white = '#D0C5B7'

# Theme roles (use in your modules: fg:accent, bg:surface, etc.)
accent = '#8A4530'
accent-secondary = '#B07840'
on-accent = '#E4DED6'
surface = '#CFC4B6'
border = '#CABEAE'
muted = '#222D38'
info = '#304050'
hint = '#100E0D'
success = '#3A5830'
warning = '#8A4530'
error = '#6A2828'
