# Akari Night — tmux theme
# A dark palette inspired by Japanese alleys lit by round lanterns.

# Palette
# Base
%hidden AKARI_BG="#25231F"
%hidden AKARI_FG="#E6DED3"

# UI roles
%hidden AKARI_SURFACE="#323333"
%hidden AKARI_BORDER="#3F4346"
%hidden AKARI_SELECTION_BG="#51422E"
%hidden AKARI_SELECTION_FG="#E6DED3"
%hidden AKARI_ACTIVE_BG="#3A3E40"
%hidden AKARI_ACCENT="#E26A3B"
%hidden AKARI_MUTED="#9BABB9"

# Diagnostic roles
%hidden AKARI_WARNING="#E26A3B"

# Status bar
set-option -g status-style "bg=$AKARI_BG,fg=$AKARI_FG"
set-option -g status-position top
set-option -g status-justify left

# Status left (configured by akari.tmux for icon customization)
set-option -g status-left-length 100

# Status right
# Leave status-right unset so the user can compose it (e.g. tmux-continuum's
# "#{continuum_status}", battery indicators, etc.). Setting it to an empty
# string here would clobber any #{continuum_status} marker that tmux-continuum
# appends after the theme is sourced, silently disabling its auto-save trigger.
set-option -g status-right-length 100

# Window status
set-option -g window-status-format "#[fg=$AKARI_MUTED] #I:#W "
set-option -g window-status-current-format "#[bg=$AKARI_ACTIVE_BG,fg=$AKARI_ACCENT,bold] #I:#W #[bg=$AKARI_BG]"
set-option -g window-status-separator ""

# Pane borders
set-option -g pane-border-style "fg=$AKARI_BORDER"
set-option -g pane-active-border-style "fg=$AKARI_ACCENT"

# Pane border status
set-option -g pane-border-format "#[fg=$AKARI_MUTED] #{pane_title} "

# Message style
set-option -g message-style "bg=$AKARI_SURFACE,fg=$AKARI_WARNING"
set-option -g message-command-style "bg=$AKARI_SURFACE,fg=$AKARI_FG"

# Mode style (copy mode, etc.)
set-option -g mode-style "bg=$AKARI_SELECTION_BG,fg=$AKARI_SELECTION_FG"

# Clock
set-option -g clock-mode-colour "$AKARI_ACCENT"
