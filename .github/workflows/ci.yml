name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Cache katazome
      uses: actions/cache@v6
      with:
        path: .katazome
        key: katazome-${{ runner.os }}-${{ hashFiles('scripts/install-katazome') }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install katazome
      run: scripts/install-katazome

    - name: Generate theme files
      run: .katazome/bin/katazome generate --theme-dir themes/akari --tool all --out-dir dist

    - name: Check for uncommitted changes
      run: git diff --exit-code

    - name: Check mirror assembly
      run: scripts/check-mirrors

    - name: Test Helix upstream branch update
      run: scripts/test-update-helix-branch

  status-check:
    needs: [generate]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Check all jobs passed
      run: |
        if [[ "${{ needs.generate.result }}" != "success" ]]; then
          exit 1
        fi
