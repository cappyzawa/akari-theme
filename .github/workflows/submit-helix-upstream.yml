name: Submit Helix Theme Upstream

on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:

concurrency:
  group: submit-helix-upstream
  cancel-in-progress: true

env:
  BRANCH: update-akari-theme

jobs:
  submit-upstream:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout akari-theme
      uses: actions/checkout@v6

    - name: Generate GitHub App token
      uses: actions/create-github-app-token@v3
      id: app-token
      with:
        app-id: ${{ secrets.AKARI_APP_ID }}
        private-key: ${{ secrets.AKARI_APP_PRIVATE_KEY }}
        repositories: helix

    - name: Determine version
      id: version
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        if [[ "${REF_TYPE}" == "tag" ]]; then
          echo "version=${REF_NAME}" >> "$GITHUB_OUTPUT"
        else
          echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
        fi

    - name: Sync fork with upstream
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        gh repo sync cappyzawa/helix -b master

    - name: Checkout fork
      uses: actions/checkout@v6
      with:
        repository: cappyzawa/helix
        token: ${{ steps.app-token.outputs.token }}
        ref: master
        fetch-depth: 1
        path: helix-fork

    - name: Copy theme files
      run: |
        cp dist/helix/akari-*.toml helix-fork/runtime/themes/
        cp LICENSE helix-fork/runtime/themes/licenses/akari.license

    - name: Check for changes
      id: changes
      working-directory: helix-fork
      run: |
        git add runtime/themes/akari-*.toml runtime/themes/licenses/akari.license
        if git diff --staged --quiet; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "No changes detected"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Check for existing PR
      if: steps.changes.outputs.changed == 'true'
      id: existing-pr
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        PR_URL=$(gh pr list \
          --repo helix-editor/helix \
          --head "cappyzawa:${BRANCH}" \
          --state open \
          --json url \
          --jq '.[0].url // empty')
        if [[ -n "${PR_URL}" ]]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "url=${PR_URL}" >> "$GITHUB_OUTPUT"
          echo "Existing PR: ${PR_URL}"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Commit and push
      if: steps.changes.outputs.changed == 'true'
      working-directory: helix-fork
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        git config user.name "akari-theme[bot]"
        git config user.email "akari-theme[bot]@users.noreply.github.com"
        git checkout -b "${BRANCH}"
        git commit -m "Update akari theme to ${VERSION}"
        git push --force-with-lease origin "${BRANCH}"

    - name: Update existing pull request body
      if: steps.changes.outputs.changed == 'true' && steps.existing-pr.outputs.exists == 'true'
      env:
        GH_TOKEN: ${{ secrets.AKARI_PAT }}
        VERSION: ${{ steps.version.outputs.version }}
        PR_URL: ${{ steps.existing-pr.outputs.url }}
        REF_TYPE: ${{ github.ref_type }}
      run: |
        BODY="Update akari-night and akari-dawn themes to ${VERSION}."
        if [[ "${REF_TYPE}" == "tag" ]]; then
          BODY="${BODY}

        Upstream: https://github.com/cappyzawa/akari-theme/releases/tag/${VERSION}"
        fi
        BODY="${BODY}

        Repository: https://github.com/cappyzawa/akari-theme"

        gh pr edit "${PR_URL}" --body "${BODY}"

    - name: Create pull request
      if: steps.changes.outputs.changed == 'true' && steps.existing-pr.outputs.exists == 'false'
      env:
        GH_TOKEN: ${{ secrets.AKARI_PAT }}
        VERSION: ${{ steps.version.outputs.version }}
        REF_TYPE: ${{ github.ref_type }}
      run: |
        BODY="Update akari-night and akari-dawn themes to ${VERSION}."
        if [[ "${REF_TYPE}" == "tag" ]]; then
          BODY="${BODY}

        Upstream: https://github.com/cappyzawa/akari-theme/releases/tag/${VERSION}"
        fi
        BODY="${BODY}

        Repository: https://github.com/cappyzawa/akari-theme"

        gh pr create \
          --repo helix-editor/helix \
          --head "cappyzawa:${BRANCH}" \
          --base master \
          --title "Update akari theme" \
          --body "${BODY}"
