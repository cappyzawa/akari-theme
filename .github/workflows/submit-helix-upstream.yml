name: Submit Helix Theme Upstream

on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:

concurrency:
  group: submit-helix-upstream
  cancel-in-progress: true

env:
  BRANCH: update-akari-theme

jobs:
  submit-upstream:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout akari-theme
      uses: actions/checkout@v6

    - name: Generate GitHub App token
      uses: actions/create-github-app-token@v3
      id: app-token
      with:
        app-id: ${{ secrets.AKARI_APP_ID }}
        private-key: ${{ secrets.AKARI_APP_PRIVATE_KEY }}
        repositories: helix

    - name: Determine version
      id: version
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        if [[ "${REF_TYPE}" == "tag" ]]; then
          echo "version=${REF_NAME}" >> "$GITHUB_OUTPUT"
        else
          echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
        fi

    - name: Sync fork with upstream
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        gh repo sync cappyzawa/helix -b master

    - name: Checkout fork
      uses: actions/checkout@v6
      with:
        repository: cappyzawa/helix
        token: ${{ steps.app-token.outputs.token }}
        ref: master
        fetch-depth: 0
        path: helix-fork

    - name: Switch to update branch
      id: branch
      working-directory: helix-fork
      run: |
        git config user.name "akari-theme[bot]"
        git config user.email "akari-theme[bot]@users.noreply.github.com"
        if git ls-remote --exit-code --heads origin "${BRANCH}" > /dev/null 2>&1; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
          git fetch origin "${BRANCH}"
          git checkout "${BRANCH}"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
          git checkout -b "${BRANCH}"
        fi

    - name: Copy theme files
      run: |
        cp dist/helix/akari-*.toml helix-fork/runtime/themes/
        cp LICENSE helix-fork/runtime/themes/licenses/akari.license

    - name: Check for changes
      id: changes
      working-directory: helix-fork
      run: |
        git add runtime/themes/akari-*.toml runtime/themes/licenses/akari.license
        if git diff --staged --quiet; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "No changes detected"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Commit and push
      if: steps.changes.outputs.changed == 'true'
      working-directory: helix-fork
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        git commit -m "Update akari theme to ${VERSION}"
        git push origin "${BRANCH}"

    - name: Check for existing PR
      if: steps.changes.outputs.changed == 'true'
      id: existing-pr
      env:
        GH_TOKEN: ${{ secrets.AKARI_PAT }}
      run: |
        PR_URL=$(gh pr list \
          --repo helix-editor/helix \
          --head "cappyzawa:${BRANCH}" \
          --state open \
          --json url \
          --jq '.[0].url // empty')
        if [[ -n "${PR_URL}" ]]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "Existing PR: ${PR_URL}"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Create pull request
      if: steps.changes.outputs.changed == 'true' && steps.existing-pr.outputs.exists == 'false'
      env:
        GH_TOKEN: ${{ secrets.AKARI_PAT }}
      run: |
        gh pr create \
          --repo helix-editor/helix \
          --head "cappyzawa:${BRANCH}" \
          --base master \
          --title "Update akari theme" \
          --body "Update akari-night and akari-dawn themes.

        Repository: https://github.com/cappyzawa/akari-theme"
