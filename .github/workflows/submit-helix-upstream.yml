name: Submit Helix Theme Upstream

on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:

concurrency:
  group: submit-helix-upstream
  cancel-in-progress: true

env:
  BRANCH: update-akari-theme

jobs:
  submit-upstream:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout akari-theme
      uses: actions/checkout@v6

    - name: Generate GitHub App token
      uses: actions/create-github-app-token@v3
      id: app-token
      with:
        app-id: ${{ secrets.AKARI_APP_ID }}
        private-key: ${{ secrets.AKARI_APP_PRIVATE_KEY }}
        repositories: helix

    - name: Determine version
      id: version
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        if [[ "${REF_TYPE}" == "tag" ]]; then
          echo "version=${REF_NAME}" >> "$GITHUB_OUTPUT"
        else
          echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
        fi

    - name: Sync fork with upstream
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        gh repo sync cappyzawa/helix -b master

    - name: Checkout fork
      uses: actions/checkout@v6
      with:
        repository: cappyzawa/helix
        token: ${{ steps.app-token.outputs.token }}
        ref: master
        fetch-depth: 0
        path: helix-fork

    - name: Update branch
      id: update
      env:
        GH_TOKEN: ${{ secrets.AKARI_PAT }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        git -C helix-fork config user.name "akari-theme[bot]"
        git -C helix-fork config user.email "akari-theme[bot]@users.noreply.github.com"
        scripts/update-helix-branch helix-fork "${VERSION}"

    - name: Create pull request
      if: steps.update.outputs.pushed == 'true' && steps.update.outputs.open-pr == 'false'
      env:
        GH_TOKEN: ${{ secrets.AKARI_PAT }}
      run: |
        gh pr create \
          --repo helix-editor/helix \
          --head "cappyzawa:${BRANCH}" \
          --base master \
          --title "Update akari theme" \
          --body "Update akari-night and akari-dawn themes.

        Repository: https://github.com/cappyzawa/akari-theme"
