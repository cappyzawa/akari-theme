name: Auto Generate

on:
  push:
    branches:
      - renovate/**

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Check if last commit is auto-generated
      id: check
      run: |
        if git log -1 --format='%an' | grep -q 'github-actions'; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Install Rust
      if: steps.check.outputs.skip != 'true'
      uses: dtolnay/rust-toolchain@stable

    - name: Generate theme files
      if: steps.check.outputs.skip != 'true'
      run: cargo run --features generator -- generate --tool all

    - name: Commit and push if changed
      if: steps.check.outputs.skip != 'true'
      run: |
        if ! git diff --quiet; then
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate theme files"
          git push
        fi
