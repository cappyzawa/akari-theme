[package]
name = "katazome"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cappyzawa/katazome"
description = "Generates color theme files for terminals, editors and other tools from a theme directory"
keywords = ["theme", "color-scheme", "generator", "terminal", "editor"]
categories = ["command-line-utilities", "template-engine"]
include = ["/src/", "/build.rs", "/templates/", "/Cargo.toml", "/README.md", "/LICENSE"]

[lib]
name = "katazome"
path = "src/lib.rs"

[[bin]]
name = "katazome"
path = "src/main.rs"
required-features = ["generator"]

[[test]]
name = "theme_generator"
path = "tests/theme_generator.rs"
required-features = ["generator"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["generator"]

[features]
default = ["generator"]
generator = ["dep:tera", "dep:walkdir", "dep:plist", "dep:clap"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
toml = "0.9.10"

# Generator dependencies (optional)
plist = { version = "1", optional = true }
tera = { version = "1.20.1", optional = true }
walkdir = { version = "2", optional = true }

# CLI dependencies (optional, for generator binary)
clap = { version = "4.5.53", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
